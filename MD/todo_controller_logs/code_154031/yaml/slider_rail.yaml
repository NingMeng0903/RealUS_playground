# Parametric slider/rail spec for the RM75 8-DOF base.
# Consumed by param_model/generator.py -> generated URDF for Genesis viewer.
# Conventions: rail travel = Y, Z up.
#   - arm base_link is centered on the slider top
#   - URDF root = rail_base (frame bottom)
#   - rail_link frame = rail module floor (top of frame); slider_link = slider top center
#   - world placement from world_calib (base pose at rail_y = 0 = -Y end), NOT frame pose
# All lengths in millimeters unless noted (meters for world_calib positions).
slider_rail:
  arm: rm75                      # future: select arm base ("realmanbase")

  rail:
    # Usable carriage stroke (rail_y limits = [0, travel]).
    effective_travel_mm: 800
    # Extra total length beyond the flush fit (0 = slider face exactly against
    # each end-plate *inner* face at the travel limits). Rail total length is:
    #   travel + slider.length_mm + 2 * side_plate_thickness_mm + end_overhead_mm
    end_overhead_mm: 0
    width_mm: 100                 # total rail deck width (X)
    base_plate_thickness_mm: 20   # rail deck plate
    track_height_mm: 10           # two raised tracks (low profile)
    track_width_mm: 16
    track_gap_mm: 50              # center-to-center of the two tracks
    side_plate_thickness_mm: 14   # end plate thickness along Y
    side_plate_height_mm: 80      # end plate height (Z) above rail bottom

  slider:
    width_mm: 120                 # X
    length_mm: 120                # Y
    # auto → grow so base_link stays at world_calib.base_pos_m[2] while the
    # 20 mm stand still meets the floor.
    top_to_rail_bottom_mm: auto

  frame:                          # stand under the rail (derived from rail_base)
    height_mm: 20                 # ~2 cm, contacts the floor (plus floor_sink_mm)
    floor_sink_mm: 2              # bury this much into z=0 (no air gap)
    width_mm: 120                 # under-rail width; +X flush with rail +X face
    extend_rear_mm: 400           # extra stand toward -X (rear / toward the bed)

  arm_mount:                      # base_link on slider top (URDF internal)
    offset_x_mm: 0                # centered
    offset_y_mm: 0

  world_calib:
    # base_link world pose @ rail_y = 0 (-Y end). Overlay from
    # slider_rail.calibrated.yaml after Stage 2. Hand values are fallback only.
    base_pos_m: [-0.05, 0.41, 0.26]
    base_quat_wxyz: [0.7071067811865476, 0.0, 0.0, -0.7071067811865476]  # world Z -90 deg

  colors:                         # rgba 0..1
    frame: [0.75, 0.75, 0.78, 1.0]
    rail_deck: [0.46, 0.46, 0.48, 1.0]   # rail 底板, slightly darker gray
    rail_metal: [0.58, 0.58, 0.60, 1.0]  # tracks
    dark: [0.18, 0.18, 0.20, 1.0]
