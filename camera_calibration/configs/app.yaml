# Runtime / UI parameters.

stream:
  # 4x D435 1920x1080. Current cabling is 2 cameras per USB3 hub — try 30 fps
  # first. If publisher hits "Couldn't resolve requests" or wait_for_frames
  # timeouts, restart Cam with --fps 15 (K does not depend on fps).
  # After changing width/height you must re-run Stage 0 then Stage 1/2.
  width: 1920
  height: 1080
  fps: 30
  color_format: bgr8       # driver returns numpy HxWx3 uint8 in BGR order

sync:
  max_spread_ms: 40
  capture_poll_attempts: 30
  capture_poll_interval_ms: 2.0
  use_device_timestamp: true

preview:
  source: local
  zmq_connect: tcp://127.0.0.1:17356
  zmq_preview_topic: amongus_camera_preview_v1
  zmq_capture_topic: amongus_camera_frame_v1

detector:
  nthreads: 4
  quad_decimate: 1.0
  quad_sigma: 0.0
  refine_edges: 1
  decode_sharpening: 0.25
  preview_quad_decimate: 1.0

ui:
  preview_refresh_hz: 15   # same cadence as fb97347; stream threads stay at stream.fps

recording:
  # Where per-session raw images + detections are stored.
  root_dir: data
  save_images: true        # save RGB PNGs alongside detections (large but auditable)
  jpeg_quality: 95

calibration:
  # Per (frame, camera) view: only contribute to PnP / BA when at least this many
  # tags are detected. 80/132 ≈ 60% coverage — good for long-bed setups where
  # end cameras often see the board at grazing angles in a given pose.
  min_tags_per_view: 80
  min_frames: 10           # total samples before "Run" is enabled
  # Soft hint in the UI when a capture has fewer than this many qualifying cameras.
  min_qualifying_cameras_hint: 3
  ba:
    loss: cauchy
    f_scale: 1.0
    max_nfev: 50
    verbose: 1
