[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ird-playground"
version = "0.1.0"
description = "RM4D signed inverse-reachability field and differentiable Region A"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "scipy",
]

[project.optional-dependencies]
torch = ["torch"]
dev = ["pytest"]

[project.scripts]
ird-build-pose-gt = "ird_playground.cli.build_gpu_pose_gt:main"
ird-build-boundary-gt = "ird_playground.cli.build_gpu_boundary_stencil:main"
ird-build-canonical-gt = "ird_playground.cli.build_canonical_gt:main"
ird-train = "ird_playground.cli.train_signed:main"
ird-eval = "ird_playground.cli.eval_signed:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ird_playground*"]

[tool.pytest.ini_options]
addopts = "-p no:dash"
testpaths = ["tests"]
