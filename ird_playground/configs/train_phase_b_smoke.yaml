# M1 short smoke: Phase B 5 epochs warm-start (pipeline check only)

data:
  gt_npz: data/ird/gt_samples_1p5cm_probe.npz
  val_frac: 0.15

model:
  feature_kind: pu6
  num_freqs: 6
  num_freqs_u: 5
  hidden: 256
  depth: 5
  tau_m: 1.0
  lambda_q: 0.5
  use_physical_pe: true
  p_scale_m: 1.0

training:
  phase: B
  selection_metric: joint

  seed: 42
  device: cuda

  epochs: 5
  batch_size: 1024
  num_workers: 4

  learning_rate: 1.0e-4
  lr_aux_heads: 1.0e-4
  lr_trunk: 2.0e-5
  lr_cls_head: 1.0e-5

  weight_decay: 1.0e-4
  warmup_steps: 50
  min_lr_ratio: 0.01
  grad_clip_norm: 10.0

  init_checkpoint: data/checkpoints/smoke_phase_a/selected.pt
  freeze_backbone_cls_epochs: 2
  warm_start_iou_min: 0.55

  joint_w_margin: 0.5
  joint_w_q_spearman: 0.05

  save_freq: 1
  val_eval_n: 16384
  val_calib_frac: 0.5
  train_hard_y: true
  print_every_steps: 100

  batch_mix:
    interior: 0.15
    bnd_pos: 0.25
    bnd_neg: 0.25
    jitter_pos: 0.10
    jitter_neg: 0.10
    exterior: 0.15

loss:
  lambda_cls: 1.0
  lambda_margin: 0.25
  lambda_q: 0.10
  lambda_local: 0.0

io:
  checkpoint: data/checkpoints/smoke_phase_b/selected.pt
  checkpoint_dir: data/checkpoints/smoke_phase_b
  report: data/reports/train_phase_b_smoke.json

wandb:
  enable: false
  project: neural-ird-rm75
  entity: lpei82060-technical-university-of-munich
  mode: disabled
  run_name: neural_ird_v6_phase_b_smoke
  tags:
    - smoke
    - phase_b
