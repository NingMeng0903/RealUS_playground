# M1 short smoke: Phase A 3 epochs on current v6 GT (pipeline check only)

data:
  gt_npz: data/ird/gt_samples_1p5cm_probe.npz
  val_frac: 0.15
  split_strategy: pose_group

model:
  feature_kind: pu6
  position_encoder: hash_grid
  hash_levels: 10
  hash_features_per_level: 2
  hash_log2_size: 17
  hash_base_resolution: 8
  hash_max_resolution: 192
  num_freqs: 6
  num_freqs_u: 3
  hidden: 256
  depth: 5
  tau_m: 1.0
  lambda_q: 0.5
  use_physical_pe: true
  p_scale_m: 1.0

training:
  phase: A
  selection_metric: iou

  seed: 42
  device: cuda

  epochs: 3
  batch_size: 1024
  num_workers: 4

  learning_rate: 3.0e-4
  lr_trunk: 3.0e-4
  lr_cls_head: 3.0e-4
  lr_aux_heads: 3.0e-4

  weight_decay: 1.0e-4
  warmup_steps: 100
  min_lr_ratio: 0.01
  grad_clip_norm: 10.0

  init_checkpoint: null
  freeze_backbone_cls_epochs: 0

  save_freq: 1
  val_eval_n: 16384
  val_calib_frac: 0.5
  train_hard_y: true
  print_every_steps: 100

  batch_mix:
    interior: 0.15
    bnd_pos: 0.25
    bnd_neg: 0.25
    jitter_pos: 0.10
    jitter_neg: 0.10
    exterior: 0.15

loss:
  lambda_cls: 1.0
  lambda_margin: 0.0
  lambda_q: 0.0
  lambda_local: 0.0

io:
  checkpoint: data/checkpoints/smoke_phase_a/selected.pt
  checkpoint_dir: data/checkpoints/smoke_phase_a
  report: data/reports/train_phase_a_smoke.json

wandb:
  enable: false
  project: neural-ird-rm75
  entity: lpei82060-technical-university-of-munich
  mode: disabled
  run_name: neural_ird_v6_phase_a_smoke
  tags:
    - smoke
    - phase_a
