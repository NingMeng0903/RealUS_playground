# Phase B: cls + boundary margin + q (after v6 Phase A gate)

data:
  gt_npz: data/ird/gt_samples_1p5cm_probe.npz
  synthetic_n: 8192
  val_frac: 0.15

model:
  num_freqs: 6
  num_freqs_u: 5
  hidden: 256
  depth: 5
  tau_m: 1.0
  lambda_q: 0.5
  use_physical_pe: true
  p_scale_m: 1.0

training:
  seed: 42
  batch_size: 1024
  num_workers: 4
  torch_compile: false
  epochs: 60
  save_freq: 10
  learning_rate: 2.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 300
  min_lr_ratio: 0.01
  grad_clip_norm: 10.0
  log_every_steps: 10
  print_every_steps: 50
  hardneg_every: 0
  hardneg_frac: 0.0
  val_eval_n: 65536
  val_calib_frac: 0.5
  train_hard_y: true
  device: cuda
  batch_mix:
    interior: 0.15
    bnd_pos: 0.25
    bnd_neg: 0.25
    jitter_pos: 0.10
    jitter_neg: 0.10
    exterior: 0.15

loss:
  lambda_cls: 1.0
  lambda_margin: 0.25
  lambda_q: 0.1
  lambda_local: 0.0

io:
  checkpoint: data/checkpoints/phase_b_latest.pt
  checkpoint_dir: data/checkpoints
  report: data/reports/train_phase_b.json

pass:
  mae_max: 0.35
  spearman_min: 0.70
  boundary_iou_min: 0.65
  grad_cosine_min: 0.30
  ascent_improve_min: 0.40
  rail_ad_fd_rel_max: 0.25
  rail_sign_agree_min: 0.80
  region_improve_min: 0.40

wandb:
  enable: true
  project: neural-ird-rm75
  entity: lpei82060-technical-university-of-munich
  mode: online
  run_name: neural_ird_v6_margin_q
  tags: [neural_ird, v6, stable_support, physical_pe, margin_q]
