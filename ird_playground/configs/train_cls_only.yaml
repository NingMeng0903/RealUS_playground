# Phase-1: classification only — prove BCE learns before adding margin/q
# Env: source ird_playground/env.sh

data:
  gt_npz: data/ird/gt_samples_1p5cm_probe.npz
  synthetic_n: 8192
  val_frac: 0.15

model:
  num_freqs: 6
  hidden: 256
  depth: 5
  tau_m: 1.0
  lambda_q: 0.5

training:
  seed: 42
  batch_size: 1024
  num_workers: 4
  torch_compile: false
  epochs: 30
  save_freq: 10
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 500
  min_lr_ratio: 0.01
  grad_clip_norm: 10.0
  log_every_steps: 10
  print_every_steps: 50
  hardneg_every: 0
  hardneg_frac: 0.0
  device: cuda

loss:
  lambda_cls: 1.0
  lambda_margin: 0.0
  lambda_q: 0.0
  lambda_local: 0.0

io:
  checkpoint: data/checkpoints/cls_only_latest.pt
  checkpoint_dir: data/checkpoints
  report: data/reports/train_cls_only.json

pass:
  mae_max: 9.0
  spearman_min: 0.0
  boundary_iou_min: 0.70
  grad_cosine_min: 0.0
  ascent_improve_min: 0.0
  rail_ad_fd_rel_max: 1.0
  rail_sign_agree_min: 0.0
  region_improve_min: 0.0

wandb:
  enable: true
  project: neural-ird-rm75
  entity: lpei82060-technical-university-of-munich
  mode: online
  run_name: neural_ird_v3_cls_only
  tags: [neural_ird, 5dof, cls_only]
