build:
  source_npz: data/ird/gpu_pose_stencils_production.npz
  auxiliary_npz:
    - data/ird/gpu_pose_uniform_production.npz
  edt_npz: data/maps/flange_sdf_production.npz
  far_field_sdf_weight: 0.25
  output_npz: data/ird/rm4d_signed_production.npz
  quantile_lo: 0.005
  quantile_hi: 0.995
  min_pair_separation_normalized: 0.00001
  robot_spec: configs/robot_probe45.yaml

model:
  width: 192
  depth: 5
  fourier_bands: 3
  softplus_beta: 20.0

training:
  seed: 47
  device: cuda
  epochs: 30
  batch_size: 4096
  learning_rate: 0.0003
  weight_decay: 0.0001
  val_fraction: 0.15
  early_stop_patience: 8
  logit_scale: 1.0
  normal_batch_max: 768
  report_near_axis: true
  near_axis_r_m: 0.05
  boundary_sample_boost: 2.5

loss:
  classification: 1.0
  signed_value: 6.0
  normal_direction: 0.35
  eikonal: 0.12
  straddle: 1.5
  straddle_margin: 0.25
  sdf_target_scale: 100.0
  near_band_abs: 0.01
  near_band_boost: 3.0

io:
  checkpoint: data/checkpoints/rm4d_signed/selected.pt
  report: data/reports/train_rm4d_signed.json
  conformal: data/calib/conformal_rm4d_signed.json
