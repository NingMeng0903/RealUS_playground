# Enough held-out blocks for an automated accuracy and gradient pilot.
out: data/ird/continuous_ik_pilot_1mm.npz
sampling:
  n_fk_interior: 384
  n_boundary_rays: 512
  n_random_seeds: 4
  ray_max_pos_m: 0.16
  ray_max_rot_deg: 20.0
  boundary_tol_m: 0.001
  ik_tol_pos_m: 0.0002
  ik_tol_rot_rad: 0.001
  ik_max_iter: 80
  margin_sigma_p_m: 0.003
  boundary_offset_m: 0.003
  exterior_offset_m: 0.01
  seed: 42
