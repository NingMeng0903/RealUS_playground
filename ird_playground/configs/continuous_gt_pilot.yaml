# Enough held-out blocks for an automated accuracy and gradient pilot.
out: data/ird/continuous_ik_pilot.npz
sampling:
  n_fk_interior: 384
  n_boundary_rays: 512
  rotation_ray_fraction: 0.35
  joint_limit_inset_fraction: 0.05
  n_random_seeds: 4
  self_collision: true
  ray_max_pos_m: 0.30
  ray_max_rot_deg: 45.0
  boundary_tol_m: 0.001
  boundary_tol_rot_deg: 0.35
  ik_tol_pos_m: 0.0002
  ik_tol_rot_rad: 0.001
  ik_max_iter: 70
  margin_sigma_p_m: 0.006
  margin_sigma_rot_deg: 3.0
  position_offsets_mm: [1.0, 3.0, 6.0, 10.0]
  rotation_offsets_deg: [1.0, 3.0, 5.0]
  log_every_rays: 50
  seed: 42
