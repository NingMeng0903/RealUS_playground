# IRD GT v3 — bitmask-exact, EDT signed margin, 6-D (t,u), AABB from features

map_dir: ../rm75_control/data/reachability/rm75_6f_1p5cm_15deg_coll_probe
out: data/ird/gt_samples_1p5cm_probe.npz

sampling:
  n_interior: 700000
  n_boundary: 800000
  n_exterior: 500000
  n_jitter: 200000
  max_orients_per_voxel: 28
  hard_negative_frac: 0.45
  hard_negative_radius_m: 0.06
  sigma_p_m: 0.03
  sigma_r_deg: 10.0
  m_clip: 3.0
  m_eps: 0.05
  edt_dilate: 2
  bbox_margin_m: 0.20
  comfort_from: auto
  k_candidates: 4
  seed: 42
