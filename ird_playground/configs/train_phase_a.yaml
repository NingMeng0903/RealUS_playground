# Phase A: classification-only reachable field (global coarse GT baseline)
# cd ird_playground && source env.sh
# python -m ird_playground.cli.train --config configs/train_phase_a.yaml
#
# Do NOT long-train this as the final operator. Prefer short smoke first
# (configs/train_phase_a_smoke.yaml), then formal A0/A1/A2 on finer GT.

data:
  gt_npz: data/ird/gt_samples_1p5cm_probe.npz
  val_frac: 0.15
  split_strategy: pose_group

model:
  feature_kind: pu6
  position_encoder: hash_grid
  hash_levels: 12
  hash_features_per_level: 2
  hash_log2_size: 18
  hash_base_resolution: 8
  hash_max_resolution: 256
  num_freqs: 6
  num_freqs_u: 3
  hidden: 256
  depth: 5
  tau_m: 1.0
  lambda_q: 0.5
  use_physical_pe: true
  p_scale_m: 1.0

training:
  phase: A
  selection_metric: iou

  seed: 42
  device: cuda

  epochs: 40
  batch_size: 1024
  num_workers: 4

  learning_rate: 3.0e-4
  lr_trunk: 3.0e-4
  lr_cls_head: 3.0e-4
  lr_aux_heads: 3.0e-4

  weight_decay: 1.0e-4
  warmup_steps: 500
  min_lr_ratio: 0.01
  grad_clip_norm: 10.0

  init_checkpoint: null
  freeze_backbone_cls_epochs: 0

  save_freq: 0
  val_eval_n: 65536
  val_calib_frac: 0.5
  train_hard_y: true

  batch_mix:
    interior: 0.15
    bnd_pos: 0.25
    bnd_neg: 0.25
    jitter_pos: 0.10
    jitter_neg: 0.10
    exterior: 0.15

loss:
  lambda_cls: 1.0
  lambda_margin: 0.0
  lambda_q: 0.0
  lambda_local: 0.0

io:
  checkpoint: data/checkpoints/phase_a/selected.pt
  checkpoint_dir: data/checkpoints/phase_a
  report: data/reports/train_phase_a.json

pass:
  mae_max: 9.0
  spearman_min: 0.0
  boundary_iou_min: 0.65
  grad_cosine_min: 0.0
  ascent_improve_min: 0.0
  rail_ad_fd_rel_max: 1.0
  rail_sign_agree_min: 0.0
  region_improve_min: 0.0

wandb:
  enable: false
  project: neural-ird-rm75
  entity: lpei82060-technical-university-of-munich
  mode: online
  run_name: neural_ird_v6_phase_a
  tags:
    - neural_ird
    - v6
    - phase_a
    - cls_only
