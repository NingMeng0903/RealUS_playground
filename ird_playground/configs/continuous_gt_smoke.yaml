# Fast validation only; does not claim production spatial coverage.
out: data/ird/continuous_ik_smoke.npz
sampling:
  n_fk_interior: 32
  n_boundary_rays: 24
  rotation_ray_fraction: 0.35
  joint_limit_inset_fraction: 0.05
  n_random_seeds: 2
  self_collision: true
  ray_max_pos_m: 0.30
  ray_max_rot_deg: 45.0
  boundary_tol_m: 0.001
  boundary_tol_rot_deg: 0.5
  ik_tol_pos_m: 0.0002
  ik_tol_rot_rad: 0.001
  ik_max_iter: 60
  margin_sigma_p_m: 0.006
  margin_sigma_rot_deg: 3.0
  position_offsets_mm: [1.0, 3.0, 6.0, 10.0]
  rotation_offsets_deg: [1.0, 3.0, 5.0]
  log_every_rays: 12
  seed: 42
