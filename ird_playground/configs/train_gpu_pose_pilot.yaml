data:
  gt_npz: data/ird/gpu_pose_pilot.npz
  val_frac: 0.20
  split_strategy: pose_group

model:
  feature_kind: se3_9d
  position_encoder: hash_grid
  hash_levels: 10
  hash_features_per_level: 2
  hash_log2_size: 17
  hash_base_resolution: 8
  hash_max_resolution: 192
  num_freqs: 4
  num_freqs_u: 3
  hidden: 192
  depth: 4
  use_physical_pe: true
  couple_reach_to_margin: false

training:
  phase: A
  selection_metric: balanced_accuracy
  seed: 42
  device: cuda
  epochs: 40
  early_stop_patience: 10
  early_stop_min_delta: 0.002
  batch_size: 1024
  num_workers: 0
  learning_rate: 0.001
  warmup_steps: 100
  min_lr_ratio: 0.05
  save_freq: 0
  val_eval_n: 32768
  val_calib_frac: 0.5
  train_hard_y: true
  batch_mix:
    interior: 0.50
    bnd_pos: 0.0
    bnd_neg: 0.0
    jitter_pos: 0.0
    jitter_neg: 0.0
    exterior: 0.50

loss:
  lambda_cls: 1.0
  lambda_margin: 0.0
  lambda_q: 0.0

io:
  checkpoint: data/checkpoints/gpu_pose_pilot/selected.pt
  checkpoint_dir: data/checkpoints/gpu_pose_pilot
  report: data/reports/train_gpu_pose_pilot.json

pass:
  boundary_iou_min: 0.85

wandb:
  enable: false
