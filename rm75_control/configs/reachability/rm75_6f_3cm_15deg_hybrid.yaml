# RM75-6F TCP 220mm — hybrid build (10M MC + IK refine on boundary voxels).
# Paper-faithful: IK checks unreached tool-axis directions per voxel (Zacharias §4.3).

urdf_path: rm75_control/assets/robots/rm75_6f_8dof/RM75-6F-8dof.urdf
tcp_frame: tcp
rail_locked_at_m: 0.0

grid:
  origin_m: [-1.10, -1.10, -0.30]
  step_m: 0.03
  shape: [74, 74, 57]

orient:
  kind: icosphere
  subdiv: 3

roll:
  enabled: false
  step_deg: 15.0

mode: hybrid

mc:
  n_samples: 10_000_000
  batch: 500_000
  seed: 0

ik:
  enabled: true
  boundary_d_min: 0.02
  boundary_d_max: 0.98
  per_voxel_budget_s: 0.20
  lam: 0.05
  max_iter: 40
  keep_manipulability: true
  seeds:
    n_random: 8
    include_nominal: true
    include_zeros: true
    include_elbow_flip: true
    nominal_deg: [0.0, -45.0, 0.0, 90.0, 0.0, 45.0, 0.0]

workers: 8
reachable_radius_m: 1.20
output_dir: data/reachability/rm75_6f_3cm_15deg_hybrid
progress: true
