# RM75-6F capability map — 3 cm voxels, ~11-15° tool-axis resolution.
#
# Rail is locked at 0 during build (7-DOF sampling); online queries slide the
# map along +Y via the y_shift invariance (see MD/plan.md §5.2).

urdf_path: rm75_control/assets/robots/rm75_6f_8dof/RM75-6F-8dof.urdf
tcp_frame: tcp
rail_locked_at_m: 0.0

grid:
  origin_m: [-1.10, -1.10, -0.30]
  step_m: 0.03
  shape: [74, 74, 57]        # 312 552 voxels total; sparse filtering to ~90k reachable

orient:
  kind: icosphere            # icosphere subdiv=3 → 642 dirs (~11° mean spacing)
  subdiv: 3

roll:
  enabled: false             # 5-DOF Zacharias mode; flip to true for 6-DOF (24x storage)
  step_deg: 15.0

mode: mc                     # {mc, hybrid} — hybrid adds IK refinement (PR5)

mc:
  n_samples: 10_000_000
  batch: 500_000
  seed: 0

ik:
  enabled: false             # wired in PR5
  boundary_d_min: 0.02
  boundary_d_max: 0.98
  per_voxel_budget_s: 0.20
  lam: 0.05
  max_iter: 40
  keep_manipulability: true
  seeds:
    n_random: 8
    include_nominal: true
    include_zeros: true
    include_elbow_flip: true
    nominal_deg: [0.0, -45.0, 0.0, 90.0, 0.0, 45.0, 0.0]

workers: 8
reachable_radius_m: 1.20      # arm reach ≈ 1.09 m; small pad for wrist offsets
output_dir: data/reachability/rm75_6f_3cm_15deg
progress: true
