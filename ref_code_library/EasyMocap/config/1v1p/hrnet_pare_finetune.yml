module: myeasymocap.stages.basestage.MultiStage
args:
  output: output/sv1p # Output directory
  at_step:
    detect:
      module: myeasymocap.backbone.yolo.yolo.YoloWithTrack
      key_from_data: [images, imgnames]
      args:
        model: yolov5m
        name: person
    keypoints2d:
      module: myeasymocap.backbone.hrnet.myhrnet.MyHRNet
      key_from_data: [images, imgnames]
      key_from_previous: [bbox]
      key_keep: []
      args:
        ckpt: data/models/pose_hrnet_w48_384x288.pth
    vis2d:
      module: myeasymocap.io.vis.Vis2D
      skip: False
      key_from_data: [images]
      key_from_previous: [keypoints, bbox]
      args:
        name: vis_keypoints2d
        scale: 0.5
    infer: # Given image and detection boxes, returns body pose in crop coordinates
      module: myeasymocap.backbone.pare.pare.MyPARE
      key_from_data: [images, imgnames] # bbox, images, and image names from dataset; names used when saving results
      key_from_previous: [bbox]
      key_keep: [cameras, imgnames] # Keep these params through to final output
      args:
        ckpt: 3dpw # Use 3DPW pretrained model
  at_final:
    load_body_model: # Load SMPL model
      module: myeasymocap.io.model.SMPLLoader
      args:
        model_path: models/pare/data/body_models/smpl/SMPL_NEUTRAL.pkl
        regressor_path: models/J_regressor_body25.npy
    init_translation: # Given crop-space pose, 2D keypoints, and cameras, returns world-space body pose
      module: myeasymocap.operations.init.InitTranslation
      key_from_data: [keypoints, cameras, params] # Load keypoints, cameras, and SMPL params
      key_from_previous: [body_model] # Load SMPL model for keypoint computation
      args:
        solve_T: True
        solve_R: False
    smooth: # Smooth initialized results
      module: myeasymocap.operations.smooth.SmoothPoses
      key_from_data: [params]
      args:
        window_size: 2
    mean_param: # Mean shapes
      module: myeasymocap.operations.init.MeanShapes
      key_from_data: [params]
      args:
        keys: ['shapes']
    init_RT:
      module: myeasymocap.operations.optimizer.Optimizer
      key_from_data: [keypoints, cameras]
      key_from_previous: [model, params]
      args:
        optimizer_args: {optim_type: lbfgs}
        optimize_keys: [Th, Rh]
        loss:
          repro:
            weight: 100.
            module: myeasymocap.operations.loss.Keypoints2D
            key_from_output: [keypoints]
            key_from_infos: [keypoints, cameras]
            args:
              norm: l2
              index_est: [2, 5, 9, 12]
              index_gt: [2, 5, 9, 12]
          smooth:
            weight: 1.
            module: myeasymocap.operations.loss.Smooth
            key_from_output: [Rh, Th]
            key_from_infos: [cameras] # TODO: compute smooth weights from 2D confidence
            args:
              keys: [Th, Th]
              smooth_type: [Linear, Depth] # depth smoothing may need camera parameters for conversion
              norm: [l2, l2]
              order: [2, 2]
              weights: [100., 1000.]
              window_weight: [0.5, 0.3, 0.1, 0.1]
    refine_poses:
      repeat: 2
      module: myeasymocap.operations.optimizer.Optimizer
      key_from_data: [keypoints, cameras]
      key_from_previous: [model, params]
      args:
        optimizer_args: {optim_type: lbfgs}
        optimize_keys: [poses, Rh, Th]
        loss:
          repro:
            weight: 100.
            module: myeasymocap.operations.loss.Keypoints2D
            key_from_output: [keypoints]
            key_from_infos: [keypoints, cameras]
            args:
              norm: gm
              norm_info: 0.02
          smooth:
            weight: 1.
            module: myeasymocap.operations.loss.Smooth
            key_from_output: [poses, Rh, Th, keypoints]
            key_from_infos: [cameras] # TODO: compute smooth weights from 2D confidence
            args:
              keys: [Th, Th, poses, keypoints]
              smooth_type: [Linear, Depth, Linear, Linear] # depth smoothing may need camera parameters for conversion
              norm: [l2, l2, l2, l2]
              order: [2, 2, 2, 2]
              weights: [100., 1000., 50., 100.]
              window_weight: [0.5, 0.3, 0.1, 0.1]
          init:
            weight: 1.
            module: myeasymocap.operations.loss.Init
            key_from_output: [poses]
            key_from_infos: [init_poses]
            args:
              keys: [poses]
              norm: l2
              weights: [1.]
          prior:
            weight: 0.1
            module: easymocap.multistage.gmm.GMMPrior
            key_from_output: [poses]
            key_from_infos: []
            args:
              start: 0
              end: 69
    write:
      module: myeasymocap.io.write.WriteSMPL
      key_from_data: [meta]
      key_from_previous: [params, model]
      args:
        name: smpl
    render:
      module: myeasymocap.io.vis3d.Render
      key_from_data: [cameras, imgnames]
      key_from_previous: [params, body_model]
      args:
        backend: pyrender
    make_video:
      module: myeasymocap.io.video.MakeVideo
      args:
        fps: 30
        keep_image: False