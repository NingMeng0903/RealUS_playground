module: myeasymocap.datasets.sv1p.SVDataset
args:
  root: TO_BE_FILLED
  subs: ['video'] # One subfolder under the specified path
  ranges: [0, 10000, 1] # Frame range to use
  read_image: True # Load images for downstream CNN-based SMPL estimation
  reader:
    images:
      root: images
      ext: .jpg
    image_shape:
      root: images
      ext: .jpg